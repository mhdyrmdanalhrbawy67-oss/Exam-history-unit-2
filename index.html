<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>امتحان التاريخ - الوحدة الثانية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f2ea;--ink:#1c2233;--mute:#6b7280;--line:#e7e0d1;--brand:#6d1a2a;--brand2:#9b2c3f;--gold:#c8a24a;--gold2:#f3e3b3;--ok:#15803d;--bad:#b91c1c;--card:#fff;--sh:0 10px 30px rgba(60,20,30,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.85;font-size:17px;
background-image:radial-gradient(circle at 10% 0%,rgba(200,162,74,.12),transparent 40%),radial-gradient(circle at 100% 100%,rgba(109,26,42,.08),transparent 40%)}
a{color:var(--brand)}
input,select,textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff;transition:.15s;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--brand2);box-shadow:0 0 0 4px rgba(155,44,63,.12)}
textarea{min-height:150px;resize:vertical;line-height:1.9}
label.l{display:block;font-size:14px;font-weight:700;color:#4b5563;margin:14px 0 6px}label.l small{font-weight:400;color:var(--mute)}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border:0;border-radius:12px;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;transition:.15s;box-shadow:0 6px 16px rgba(109,26,42,.25)}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(109,26,42,.3)}.btn:disabled{opacity:.55;transform:none;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--brand);border:1.5px solid var(--brand);box-shadow:none}.btn.sm{padding:7px 14px;font-size:14px}.btn.block{width:100%}
.err{color:var(--bad);font-size:14px;min-height:22px;margin:8px 0}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.hero{background:linear-gradient(160deg,#4a0f1b 0%,#6d1a2a 55%,#8c2638 100%);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:2px solid rgba(200,162,74,.25);top:-160px;left:-160px}
.hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;border:2px solid rgba(200,162,74,.18);bottom:-110px;right:-90px}
.hero .tag{display:inline-block;background:rgba(200,162,74,.2);color:var(--gold2);border:1px solid rgba(200,162,74,.5);padding:4px 16px;border-radius:99px;font-size:14px;margin-bottom:18px;width:max-content}
.hero h1{font-size:44px;line-height:1.35;margin:0 0 12px;font-weight:800}.hero h1 span{color:var(--gold)}
.hero p{color:#f0dfe2;max-width:460px;margin:0 0 26px}
.feat{display:grid;gap:12px;position:relative;z-index:1}.feat div{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:11px 15px;backdrop-filter:blur(4px)}
.feat i{font-style:normal;font-size:22px}
.formside{display:flex;align-items:center;justify-content:center;padding:30px}
.formcard{width:100%;max-width:440px;background:var(--card);border-radius:22px;padding:30px;box-shadow:var(--sh);border:1px solid var(--line)}
.tabs{display:flex;background:#f3eee3;border-radius:12px;padding:4px;margin-bottom:12px}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:9px;font:inherit;font-weight:700;color:var(--mute);cursor:pointer}.tabs button.on{background:#fff;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.08)}
@media(max-width:860px){.auth{grid-template-columns:1fr}.hero{padding:30px 24px}.hero h1{font-size:30px}.feat{display:none}}

/* home */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;color:var(--brand);display:flex;gap:10px;align-items:center}.logo b{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--gold2);display:grid;place-items:center}
.wrap{max-width:980px;margin:0 auto;padding:22px}
.hcard{background:#fff;border-radius:24px;box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.hcard .head{background:linear-gradient(135deg,#4a0f1b,var(--brand2));color:#fff;padding:34px;text-align:center}.hcard .head h2{margin:0 0 6px;font-size:30px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:24px}.chip{background:#faf6ec;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center}.chip b{display:block;font-size:28px;color:var(--brand)}.chip span{color:var(--mute);font-size:14px}
.rules{padding:0 28px 8px;color:#4b5563}.rules li{margin:6px 0}.cta{padding:10px 28px 30px;text-align:center}
.score{width:170px;height:170px;border-radius:50%;margin:20px auto;display:grid;place-items:center;background:conic-gradient(var(--gold) var(--p),#eee 0);position:relative}.score:before{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%}.score div{position:relative;font-size:38px;font-weight:800;color:var(--brand);text-align:center;line-height:1.1}.score small{display:block;font-size:13px;color:var(--mute);font-weight:400}

/* exam */
.timer{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#4a0f1b,var(--brand2));color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.timer .in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer.low{background:linear-gradient(135deg,#7f1111,#c62828);animation:pulse 1.4s infinite}@keyframes pulse{50%{filter:brightness(1.25)}}
.clock{font-size:28px;font-weight:800;direction:ltr;letter-spacing:2px;font-variant-numeric:tabular-nums}
.bar{height:5px;background:rgba(255,255,255,.2)}.bar i{display:block;height:100%;background:var(--gold);transition:width 1s linear}
.layout{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1fr 250px;gap:20px;align-items:start}
.side{position:sticky;top:96px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh)}
.navgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.navgrid a{aspect-ratio:1;display:grid;place-items:center;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:13px;color:var(--ink);text-decoration:none;font-weight:700}.navgrid a.done{background:var(--brand);border-color:var(--brand);color:#fff}
.prog{height:8px;background:#eee;border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--brand2));transition:width .3s}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.sec h2{margin:0;font-size:22px;color:var(--brand)}.sec:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}.sec span{background:var(--gold2);color:#7a5b10;padding:2px 12px;border-radius:99px;font-size:14px;font-weight:700}
.q{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 4px 14px rgba(60,20,30,.04);scroll-margin-top:100px}
.qh{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.qn{flex:none;width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800}
.qh .t{flex:1;font-weight:500}.mk{font-size:12px;color:var(--mute);background:#f3eee3;border-radius:99px;padding:1px 10px;white-space:nowrap}
.opt{display:flex;gap:12px;align-items:center;padding:11px 14px;border-radius:13px;cursor:pointer;border:1.5px solid var(--line);margin-top:8px;transition:.12s;background:#fff}
.opt:hover{border-color:var(--brand2);background:#fdf8f9}.opt.sel{background:#f9e9ec;border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,26,42,.1)}
.opt input{display:none}.lt{flex:none;width:32px;height:32px;border-radius:50%;background:#f3eee3;color:var(--brand);display:grid;place-items:center;font-weight:800;transition:.12s}.opt.sel .lt{background:var(--brand);color:#fff}
.cc{font-size:12px;color:var(--mute);text-align:left;margin-top:4px}
.dock{position:sticky;bottom:12px;z-index:15;max-width:760px;margin:20px auto 0;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.18);padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(20,10,15,.55);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}.modal>div{background:#fff;border-radius:20px;padding:26px;max-width:420px;width:100%;text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.modal h3{margin:0 0 8px;color:var(--brand);font-size:22px}.modal .r{display:flex;gap:10px;justify-content:center;margin-top:18px}
.ro{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;border-radius:11px;border:1.5px solid var(--line);margin-top:7px}.ro.good{background:#e3f6ea;border-color:#86d0a0}.ro.bad{background:#fde8e8;border-color:#f0a3a3}.ro .lt{width:28px;height:28px;font-size:14px}
.rtabs{display:flex;gap:8px;margin:18px 0 12px;flex-wrap:wrap}.rtabs button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 20px;font:inherit;font-weight:700;cursor:pointer;color:var(--mute)}.rtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.lb{display:grid;grid-template-columns:200px 1fr 70px;gap:10px;align-items:center;margin:10px 0;font-size:14px}.lb .t{height:12px;background:#f1ece0;border-radius:9px;overflow:hidden}.lb .t i{display:block;height:100%;border-radius:9px}
.nbox{background:#fff8e6;border:1px solid #ecd9a0;border-radius:14px;padding:14px 16px;margin:14px 0}
.mdl{background:#eef8f1;border:1px dashed #8fcfa5;border-radius:11px;padding:12px;white-space:pre-wrap;margin-top:8px}.myans{background:#fffaf0;border:1px dashed #e0cf9b;border-radius:11px;padding:12px;white-space:pre-wrap}
@media(max-width:700px){.lb{grid-template-columns:1fr 1fr}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;order:-1}.navgrid{grid-template-columns:repeat(10,1fr)}}

/* support */
.helpbox{margin:0 28px 14px;background:linear-gradient(135deg,#fff7e0,#fdf0c9);border:1px solid #ead9a3;border-radius:16px;padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:.15s}.helpbox:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(150,110,20,.15)}.helpbox i{font-style:normal;font-size:28px}
.dot{background:#dc2626;color:#fff;border-radius:99px;padding:0 8px;font-size:12px;font-weight:700;margin-right:6px;display:inline-block;line-height:20px}
.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.catc{border:2px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;text-align:center;transition:.15s;background:#fff}.catc:hover{border-color:var(--brand2)}.catc.on{border-color:var(--brand);background:#f9e9ec;box-shadow:0 0 0 3px rgba(109,26,42,.1)}.catc i{font-style:normal;font-size:30px;display:block}.catc small{color:var(--mute);display:block;line-height:1.5}
.tk{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:14px;margin-top:10px;cursor:pointer;background:#fff;transition:.12s}.tk:hover{background:#fdf8f9;border-color:var(--brand2)}.tk .ci{font-size:26px}.tk .m{flex:1;min-width:0}.tk .m b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tk .m small{color:var(--mute)}
.sbd{padding:2px 12px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}.s-open{background:#fff1da;color:#b45309}.s-ans{background:#dff5e7;color:#15803d}.s-closed{background:#eee;color:#6b7280}
.msgs{display:flex;flex-direction:column;gap:12px;max-height:58vh;overflow-y:auto;padding:8px 4px}.bub{max-width:84%;padding:12px 16px;border-radius:16px;white-space:pre-wrap;line-height:1.8;word-break:break-word}.bub small{display:block;font-size:12px;opacity:.75;margin-top:4px}
.bub.me{align-self:flex-start;background:#f3eee3;border-bottom-right-radius:4px}.bub.team{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-bottom-left-radius:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}.card h3{margin:0 0 12px;color:var(--brand)}
.credit{text-align:center;padding:22px 16px 90px;color:#7a6a63;font-size:14px;line-height:1.9;border-top:1px solid var(--line);margin-top:30px;background:rgba(255,255,255,.55)}
.credit b{color:var(--brand)}.credit span{display:inline-block;margin-top:4px;color:#128c4a;font-weight:700;direction:ltr}
.modal{z-index:60}
.card2{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--sh)}
.kinds{display:flex;flex-wrap:wrap;gap:8px}.kc{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:7px 16px;cursor:pointer;font-weight:700;color:#4b5563;transition:.12s}.kc:hover{border-color:var(--brand2)}.kc.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tag{display:inline-block;background:#f3eee3;color:#6b4f2a;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:700;margin-right:6px}
.botfab{position:fixed;left:16px;bottom:16px;z-index:70;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;border:0;border-radius:99px;padding:12px 18px;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 10px 26px rgba(15,118,110,.4)}
.bot{position:fixed;left:16px;bottom:74px;z-index:71;width:360px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 100px);background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--line);display:none;flex-direction:column;overflow:hidden}
.bot.open{display:flex}.bot .bh{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}.bot .bh button{background:transparent;border:0;color:#fff;font-size:20px;cursor:pointer}
.bot .bm{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px;background:#f8f6f0}.bot .b{max-width:88%;padding:9px 13px;border-radius:14px;white-space:pre-wrap;line-height:1.75;font-size:15px}
.bot .b.me{align-self:flex-start;background:#0f766e;color:#fff;border-bottom-right-radius:4px}.bot .b.bt{align-self:flex-end;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
.bot .chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:#fff;max-height:96px;overflow-y:auto}.bot .chips button{border:1px solid #99d5cf;background:#effaf8;color:#0f766e;border-radius:99px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.bot .bi{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line);background:#fff}.bot .bi input{padding:9px 12px}.bot .bi button{padding:8px 14px}
.bot .esc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.bot .esc a,.bot .esc button{border:0;border-radius:10px;padding:7px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;text-decoration:none}.bot .esc .wa{background:#16a34a}
@media(max-width:500px){.bot{left:8px;right:8px;width:auto;max-width:none}}
.toastb{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:12px 22px;border-radius:12px;z-index:95;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:700;max-width:92vw;text-align:center}
.flag{border:0;background:#f3eee3;border-radius:9px;width:34px;height:34px;cursor:pointer;font-size:16px;opacity:.55;flex:none}.flag.on{opacity:1;background:#fde7a8;box-shadow:0 0 0 2px var(--gold)}
.navgrid a.flagged{box-shadow:0 0 0 3px var(--gold)}
.tips{margin:6px 28px 16px;background:#f4f8ff;border:1px solid #cfe0ff;border-radius:16px;padding:14px 18px}.tips b{color:#1e3a8a}.tips ul{margin:6px 0 0;padding-right:20px;color:#374151}
.bot .bo{display:flex;flex-direction:column;gap:7px;padding:10px;border-top:1px solid var(--line);background:#fff;max-height:210px;overflow-y:auto}.bot .bo button{text-align:right;border:1px solid #99d5cf;background:#effaf8;color:#0f766e;border-radius:12px;padding:9px 13px;font:inherit;font-size:14.5px;cursor:pointer;font-weight:600}.bot .bo button:hover{background:#d9f3ef}.bot .bo button.back{background:#fff;border-color:var(--line);color:var(--mute)}
.bot .note{font-size:12px;color:var(--mute);text-align:center;padding:5px;background:#fff;border-top:1px solid var(--line)}
@media print{.topbar,.botfab,.bot,#banners,.rtabs,.credit,.btn,.dock,.timer{display:none!important}body{background:#fff}}
.bnr{position:relative;border-radius:24px;overflow:hidden;margin-bottom:20px;box-shadow:0 18px 40px rgba(0,0,0,.2)}
.bnr .sl{display:none;align-items:center;gap:22px;padding:30px 34px 40px;color:#fff;position:relative;overflow:hidden}
.bnr .sl.on{display:flex;animation:bnin .55s ease}@keyframes bnin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bnr .sl:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.10);top:-120px;left:-80px}
.bnr .sl:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08);bottom:-70px;right:30%}
.bnr .sl.info{background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#60a5fa)}.bnr .sl.success{background:linear-gradient(135deg,#065f46,#10b981 70%,#6ee7b7)}
.bnr .sl.warning{background:linear-gradient(135deg,#92400e,#f59e0b 70%,#fcd34d)}.bnr .sl.urgent{background:linear-gradient(135deg,#7f1d1d,#dc2626 65%,#f87171);animation:bnin .55s ease}
.bnr .ic{flex:none;width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:grid;place-items:center;font-size:44px;backdrop-filter:blur(4px);z-index:1}
.bnr .tx{flex:1;z-index:1;min-width:0}.bnr .lb{display:inline-block;background:rgba(255,255,255,.22);padding:1px 14px;border-radius:99px;font-size:13px;font-weight:800;margin-bottom:6px}
.bnr h3{margin:0 0 4px;font-size:27px;line-height:1.4;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.2)}.bnr p{margin:0 0 10px;font-size:17px;opacity:.95;line-height:1.7}
.bnr a.go{display:inline-block;background:#fff;color:#1c2233;text-decoration:none;font-weight:800;padding:9px 22px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:.15s}.bnr a.go:hover{transform:translateY(-2px)}
.bnr .x{position:absolute;top:10px;left:12px;z-index:2;background:rgba(0,0,0,.22);border:0;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px}
.bnr .dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:2}.bnr .dots span{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.45);cursor:pointer;transition:.2s}.bnr .dots span.on{width:28px;background:#fff}
@media(max-width:640px){.bnr .sl{padding:22px 18px 38px;gap:14px}.bnr .ic{width:58px;height:58px;font-size:30px;border-radius:16px}.bnr h3{font-size:20px}.bnr p{font-size:15px}}
.bell{position:relative}.nbd{position:absolute;top:-7px;left:-7px;background:#dc2626;color:#fff;border-radius:99px;min-width:19px;height:19px;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #fff}
.bell.ring{animation:ring 1.2s ease 2}@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(6deg)}}
.np{position:fixed;top:64px;left:14px;z-index:85;width:380px;max-width:calc(100vw - 28px);max-height:72vh;overflow:auto;background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.np .nh{position:sticky;top:0;background:linear-gradient(135deg,#4a0f1b,var(--brand2));color:#fff;padding:13px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.np .nh button{background:transparent;border:0;color:#fff;font-size:18px;cursor:pointer}

<div id="app"></div>
<div class="credit">تطوير وإدارة <b>محمد رمضان الحرباوي</b><br><span>📱 واتساب: 01500492203</span></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const sb = supabase.createClient("https://ejutbpumrnvuoftvwais.supabase.co", "sb_publishable_whwX3xnNzZcNbs90ejhEGA_SiA-gPgZ");
const $ = (s) => document.querySelector(s), app = $("#app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LET = ["أ", "ب", "ج", "د"];
const AR = "٠١٢٣٤٥٦٧٨٩";
const digits = (s) => String(s || "").replace(/[٠-٩]/g, (d) => AR.indexOf(d)).replace(/\D/g, "");
const phoneEmail = (p) => digits(p) + "@student.exam.app";      // إيميل داخلي لو الطالب مكتبش إيميل
const toLogin = (v) => { v = v.trim(); return v.includes("@") ? v.toLowerCase() : phoneEmail(v); };
let timerId = null, saveTimers = {}, submitted = false;

function modal(title, body, buttons) {
  return new Promise((res) => {
    const m = document.createElement("div"); m.className = "modal";
    m.innerHTML = `<div><h3>${title}</h3><div>${body}</div><div class="r">${buttons.map((b, i) => `<button class="btn ${b.alt ? "alt" : ""}" data-i="${i}">${b.t}</button>`).join("")}</div></div>`;
    m.onclick = (e) => { const b = e.target.closest("button"); if (b) { m.remove(); res(buttons[b.dataset.i].v); } };
    document.body.appendChild(m);
  });
}


function toast(t) { const d = document.createElement("div"); d.className = "toastb"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 5000); }
let BNDATA = [], NDATA = [], bnIdx = 0, bnTimer = null, nLast = null;
const dismissed = () => { try { return JSON.parse(localStorage.getItem("bn_x") || "[]"); } catch (e) { return []; } };
const okUrl = (u) => /^https?:\/\//i.test(u || "");
const BST = { info: ["ℹ️", "إعلان"], success: ["🎉", "خبر سعيد"], warning: ["⚠️", "تنبيه"], urgent: ["🚨", "عاجل"] };
function bannerHTML() {
  const list = BNDATA.filter((b) => !dismissed().includes(b.id)); if (!list.length) return "";
  if (bnIdx >= list.length) bnIdx = 0;
  return `<div class="bnr">${list.map((b, i) => { const st = BST[b.style] ? b.style : "info"; return `<div class="sl ${st}${i === bnIdx ? " on" : ""}"><div class="ic">${esc(b.icon || BST[st][0])}</div><div class="tx"><span class="lb">${BST[st][1]}</span><h3>${esc(b.title)}</h3>${b.body ? `<p>${esc(b.body)}</p>` : ""}${okUrl(b.link_url) ? `<a class="go" href="${esc(b.link_url)}" target="_blank" rel="noopener">${esc(b.link_text || "اعرف أكتر")} ←</a>` : ""}</div><button class="x" onclick="closeBanner('${b.id}')" aria-label="إغلاق">✕</button></div>`; }).join("")}${list.length > 1 ? `<div class="dots">${list.map((_, i) => `<span class="${i === bnIdx ? "on" : ""}" onclick="gotoBanner(${i})"></span>`).join("")}</div>` : ""}</div>`;
}
function renderBanner() {
  clearInterval(bnTimer); const el = $("#banners"); if (!el) return;
  el.innerHTML = bannerHTML(); const n = BNDATA.filter((b) => !dismissed().includes(b.id)).length;
  if (n > 1) bnTimer = setInterval(() => { bnIdx = (bnIdx + 1) % n; renderBanner(); }, 7000);
}
function gotoBanner(i) { bnIdx = i; renderBanner(); }
function closeBanner(id) { const a = dismissed(); a.push(id); try { localStorage.setItem("bn_x", JSON.stringify(a)); } catch (e) {} renderBanner(); }
async function loadBanners() { try { const { data } = await sb.from("banners").select("*").order("sort").order("created_at", { ascending: false }); BNDATA = data || []; renderBanner(); } catch (e) {} }
setInterval(() => { if ($("#banners")) loadBanners(); }, 120000);

/* ===== الإشعارات 🔔 ===== */
const seenTs = () => Number(localStorage.getItem("nf_seen") || 0);
const nUnread = () => NDATA.filter((n) => new Date(n.created_at).getTime() > seenTs()).length;
function refreshBell() { const b = $("#nbd"); if (b) { const n = nUnread(); b.textContent = n; b.style.display = n ? "" : "none"; } }
async function loadNotifs() {
  try {
    const { data, error } = await sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(30); if (error) return;
    const prev = nLast; NDATA = data || []; nLast = NDATA.length ? new Date(NDATA[0].created_at).getTime() : 0; refreshBell();
    if (prev !== null && nLast > prev) { const nw = NDATA.find((x) => new Date(x.created_at).getTime() > prev); if (nw) { toast("🔔 " + nw.title); const bl = document.querySelector(".bell"); if (bl) { bl.classList.remove("ring"); void bl.offsetWidth; bl.classList.add("ring"); } } }
  } catch (e) {}
}
setInterval(() => { if (document.querySelector(".bell")) loadNotifs(); }, 60000);
function agoTxt(d) { const m = Math.floor((Date.now() - new Date(d).getTime()) / 60000); return m < 1 ? "الآن" : m < 60 ? `منذ ${m} دقيقة` : m < 1440 ? `منذ ${Math.floor(m / 60)} ساعة` : `منذ ${Math.floor(m / 1440)} يوم`; }
async function toggleNotifs() {
  const old = $("#np"); if (old) { old.remove(); return; }
  await loadNotifs(); const seen = seenTs();
  const p = document.createElement("div"); p.id = "np"; p.className = "np";
  p.innerHTML = `<div class="nh"><span>🔔 الإشعارات</span><button onclick="document.getElementById('np').remove()" aria-label="إغلاق">✕</button></div>` + (NDATA.length ? NDATA.map((n) => { const st = BST[n.kind] ? n.kind : "info"; return `<div class="ni ${st}${new Date(n.created_at).getTime() > seen ? " new" : ""}"><i>${BST[st][0]}</i><div><b>${esc(n.title)}</b>${n.body ? `<div>${esc(n.body)}</div>` : ""}${okUrl(n.link_url) ? `<a href="${esc(n.link_url)}" target="_blank" rel="noopener">${esc(n.link_text || "فتح")} ←</a><br>` : ""}<small>${agoTxt(n.created_at)}</small></div></div>`; }).join("") : `<div class="em">🔕 مفيش إشعارات دلوقتي</div>`);
  document.body.appendChild(p);
  try { localStorage.setItem("nf_seen", String(NDATA.length ? new Date(NDATA[0].created_at).getTime() : Date.now())); } catch (e) {} refreshBell();
  setTimeout(() => document.addEventListener("click", function h(ev) { const q = $("#np"); if (!q) return document.removeEventListener("click", h); if (!q.contains(ev.target) && !ev.target.closest(".bell")) { q.remove(); document.removeEventListener("click", h); } }), 0);
}

async function accountView() {
  const { data: { user } } = await sb.auth.getUser();
  const [{ data: p }, { data: cs }] = await Promise.all([sb.from("profiles").select("full_name,phone,center_id").eq("id", user.id).single(), sb.from("centers").select("id,name").order("name")]);
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div style="text-align:right"><h3 style="text-align:center">👤 حسابي</h3>
    <label class="l">الاسم الكامل</label><input id="an" value="${esc(p?.full_name)}"><label class="l">رقم الموبايل</label><input id="ap" dir="ltr" value="${esc(p?.phone || "")}">
    <label class="l">السنتر</label><select id="ac"><option value="">— بدون / أونلاين —</option>${(cs || []).map((c) => `<option value="${c.id}" ${p?.center_id === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}</select>
    <label class="l">كلمة مرور جديدة <small>(اتركها فاضية لو مش عايز تغيّرها)</small></label><input id="aw" type="password" dir="ltr" placeholder="6 أحرف على الأقل">
    <div class="err" id="ae"></div><div class="r"><button class="btn" id="as">حفظ</button><button class="btn alt" id="ax">إغلاق</button></div></div>`;
  document.body.appendChild(m);
  $("#ax").onclick = () => m.remove();
  $("#as").onclick = async () => {
    const name = $("#an").value.trim(), pw = $("#aw").value; $("#ae").textContent = "";
    if (!name) return ($("#ae").textContent = "الاسم مطلوب");
    if (pw && pw.length < 6) return ($("#ae").textContent = "كلمة المرور 6 أحرف على الأقل");
    $("#as").disabled = true;
    const { error } = await sb.from("profiles").update({ full_name: name, phone: digits($("#ap").value) || null, center_id: $("#ac").value || null }).eq("id", user.id);
    if (error) { $("#ae").textContent = "تعذر الحفظ: " + error.message; $("#as").disabled = false; return; }
    if (pw) { const r = await sb.auth.updateUser({ password: pw }); if (r.error) { $("#ae").textContent = "تم حفظ البيانات لكن تعذر تغيير كلمة المرور: " + r.error.message; $("#as").disabled = false; return; } }
    m.remove(); toast("✓ تم حفظ بياناتك"); boot();
  };
}

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return authView("login");
  try { await sb.rpc("ensure_profile"); } catch (e) {}
  loadBanners(); loadNotifs();
  home(session.user);
}

async function authView(mode, msg = "") {
  const { data: centers } = await sb.from("centers").select("id,name").order("name");
  const su = mode === "signup";
  app.innerHTML = `<div class="auth">
  <div class="hero"><span class="tag">تانية بكالوريا 2027 • الترم الأول</span>
    <h1>امتحان <span>التاريخ</span><br>الوحدة الثانية</h1>
    <p>تحولات القوة وبناء الوعي بمصر في العصر الحديث والمعاصر. امتحان شامل على الدروس الأربعة بتصحيح دقيق.</p>
    <div class="feat"><div><i>⏱️</i><span>220 دقيقة — العداد محسوب من السيرفر ومش بيقف</span></div><div><i>💾</i><span>حفظ تلقائي لكل إجابة بتكتبها</span></div><div><i>✍️</i><span>اختيار من متعدد + مقالي بتصحيح المدرس</span></div></div></div>
  <div class="formside"><div class="formcard">
    <div class="tabs"><button class="${!su ? "on" : ""}" id="t1">تسجيل الدخول</button><button class="${su ? "on" : ""}" id="t2">حساب جديد</button></div>
    ${su ? `<label class="l">الاسم الكامل</label><input id="fn" placeholder="الاسم رباعي">
      <label class="l">رقم الموبايل</label><input id="ph" inputmode="tel" dir="ltr" placeholder="01xxxxxxxxx">
      <label class="l">الإيميل <small>(اختياري)</small></label><input id="em" type="email" dir="ltr" placeholder="اتركه فاضي لو مفيش">
      <label class="l">السنتر</label><select id="ce"><option value="">— بدون / أونلاين —</option>${(centers || []).map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>`
    : `<label class="l">رقم الموبايل أو الإيميل</label><input id="id" dir="ltr" placeholder="01xxxxxxxxx">`}
    <label class="l">كلمة المرور</label><input id="pw" type="password" dir="ltr" placeholder="6 أحرف على الأقل">
    <div class="err" id="er">${esc(msg)}</div>
    <button class="btn block" id="go">${su ? "إنشاء الحساب" : "دخول"}</button></div></div></div>`;
  $("#t1").onclick = () => authView("login"); $("#t2").onclick = () => authView("signup");
  $("#go").onclick = async () => {
    const er = (t) => { $("#er").textContent = t; $("#go").disabled = false; };
    $("#go").disabled = true; $("#er").textContent = "";
    const password = $("#pw").value;
    if (password.length < 6) return er("كلمة المرور لازم 6 أحرف على الأقل");
    let res;
    if (su) {
      const full_name = $("#fn").value.trim(), phone = digits($("#ph").value), mail = $("#em").value.trim().toLowerCase();
      if (!full_name) return er("اكتب اسمك الكامل");
      if (!mail && phone.length < 10) return er("اكتب رقم موبايل صحيح (أو إيميل)");
      res = await sb.auth.signUp({ email: mail || phoneEmail(phone), password, options: { data: { full_name, phone, center_id: $("#ce").value } } });
      if (res.error) return er(/registered|already/i.test(res.error.message) ? "الحساب ده موجود بالفعل - سجّل دخول" : res.error.message);
      if (!res.data.session) return er("تم إنشاء الحساب لكن لازم تفعيله من الإيميل. تواصل مع المدرس.");
    } else {
      const v = $("#id").value; if (!v.trim()) return er("اكتب رقم الموبايل أو الإيميل");
      res = await sb.auth.signInWithPassword({ email: toLogin(v), password });
      if (res.error) return er("البيانات غير صحيحة");

    boot();

const topbar = (profile, unread = 0) => `<div class="topbar"><div class="logo" style="cursor:pointer" onclick="boot()"><b>📜</b> امتحان التاريخ</div><div>${esc(profile?.full_name)} <button class="btn alt sm" onclick="supportView()">💬 الدعم والمنتدى${unread ? `<span class="dot">${unread}</span>` : ""}</button> <button class="btn alt sm" onclick="honorView()">🏆 لوحة الشرف</button> <button class="btn alt sm bell" onclick="toggleNotifs()" aria-label="الإشعارات">🔔<span class="nbd" id="nbd" style="display:${nUnread() ? "" : "none"}">${nUnread()}</span></button> <button class="btn alt sm" onclick="accountView()">👤 حسابي</button> <button class="btn alt sm" onclick="logout()">خروج</button></div></div>`;
async function logout() { await sb.auth.signOut(); location.reload(); }

async function home(user) {
  clearInterval(timerId); { const bn = $("#banners"); if (bn) bn.style.display = ""; }
  const [{ data: profile }, { data: settings }, { data: attempts }, { count: qc }, { count: unread }] = await Promise.all([
    sb.from("profiles").select("full_name,role").eq("id", user.id).single(),
    sb.from("exam_settings").select("*").eq("id", 1).single(),
    sb.from("attempts").select("*").eq("student_id", user.id).order("created_at", { ascending: false }).limit(1),
    sb.from("questions").select("id", { count: "exact", head: true }),
    sb.from("tickets").select("id", { count: "exact", head: true }).eq("student_unread", true),
  ]);
  const a = attempts && attempts[0];
  if (a && a.status === "in_progress") return examView(a, profile, settings);
  if (a && a.status === "submitted") {
    const total = Number(a.total_override ?? (Number(a.mcq_score) + Number(a.essay_score) + Number(a.adjustment)));
    app.innerHTML = topbar(profile, unread || 0) + `<div class="wrap"><div id="banners"></div><div class="hcard"><div class="head"><h2>تم تسليم الامتحان ✅</h2><div>${esc(profile?.full_name)}</div></div>
    <div style="padding:26px;text-align:center">${a.graded ? `<div class="score" style="--p:100%"><div>${total}<small>درجتك النهائية</small></div></div><button class="btn" onclick="resultView('${a.id}')" style="margin-top:6px">📊 شوف أخطائي وإجاباتي والإحصائيات</button>` : `<p style="font-size:18px">إجاباتك اتسلّمت بنجاح 👏<br>الأسئلة المقالية بتتصحح يدويًا، وهتظهر درجتك هنا بعد اعتمادها من المدرس.</p>`}</div></div></div>`;
    renderBanner(); refreshBell(); renderHonor();
    return;
  }
  const can = (a && a.status === "not_started") || (!a && settings.is_open && settings.allow_self_start);
  app.innerHTML = topbar(profile, unread || 0) + `<div class="wrap"><div id="banners"></div><div class="hcard"><div class="head"><h2>${esc(settings.title)}</h2><div>أهلًا ${esc((profile?.full_name || "").split(" ")[0])} 👋</div></div>
  <div class="chips"><div class="chip"><b>${settings.duration_minutes}</b><span>دقيقة</span></div><div class="chip"><b>${qc || "—"}</b><span>سؤال</span></div><div class="chip"><b>2</b><span>قسمين: اختياري + مقالي</span></div></div>
  <ul class="rules"><li>الوقت بيبدأ أول ما تضغط "ابدأ" ومش بيقف لو قفلت الصفحة أو الإنترنت قطع.</li><li>كل إجابة بتتحفظ تلقائيًا، وتقدر ترجع تكمل من نفس المكان.</li><li>الاختياري بيتصحح تلقائيًا، والمقالي بيصححه المدرس يدويًا.</li><li>لما الوقت يخلص الامتحان بيتسلّم تلقائيًا.</li></ul>
  <div class="tips"><b>💡 نصايح قبل ما تبدأ:</b><ul><li>اتأكد إن النت ثابت والشاحن متوصل.</li><li>ابدأ بالاختياري وسيب المقالي لآخر وقت، ووزّع وقتك (حوالي 90 دقيقة للاختياري).</li><li>استخدم علامة 🚩 لأي سؤال محتاج يتراجع، وراجعه قبل التسليم.</li><li>اكتب المقالي بنقاط واضحة مع ذكر الأدلة التاريخية.</li></ul></div>
  <div class="helpbox" onclick="supportView()"><i>💬</i><div><b>الدعم والمنتدى</b>${unread ? `<span class="dot">${unread} رد جديد</span>` : ""}<br><small style="color:#7a5b10">عندك سؤال في المادة أو مشكلة في الموقع؟ ابعت لفريق الدعم العلمي أو الفني وهيردوا عليك هنا.</small></div></div>
  <div class="cta">${can ? `<div class="err" id="er"></div><button class="btn" id="st" style="font-size:19px;padding:15px 44px">ابدأ الامتحان</button>` : `<p class="err" style="font-size:16px">الامتحان غير متاح لك حاليًا. تواصل مع المدرس لفتح محاولة.</p>`}</div></div></div>`;
  renderBanner(); refreshBell(); renderHonor();
  if (can) $("#st").onclick = async () => {
    const ok = await modal("جاهز تبدأ؟", `هيبدأ العد التنازلي (${settings.duration_minutes} دقيقة) دلوقتي.`, [{ t: "ابدأ الآن", v: true }, { t: "رجوع", v: false, alt: true }]);
    if (!ok) return;
    $("#st").disabled = true;
    const { error } = await sb.rpc("start_attempt");
    if (error) { $("#er").textContent = (/foreign key|attempts_student/i.test(error.message) ? "حسابك محتاج تحديث بسيط. حدّث الصفحة وجرّب تاني، ولو استمرت المشكلة كلّم الدعم الفني من زر الدعم." : "تعذر بدء الامتحان: " + error.message); $("#st").disabled = false; return; }
    home(user);

}

async function examView(attempt, profile, settings) {
  submitted = false; { const bn = $("#banners"); if (bn) bn.style.display = "none"; }
  const t0 = Date.now(); const { data: sn } = await sb.rpc("server_now");

      <div class="chip"><b>${r.mcq_score}</b><span>درجة الاختياري</span></div><div class="chip"><b>${r.essay_score}</b><span>درجة المقالي</span></div><div class="chip"><b>${r.rank}<small style="font-size:14px"> / ${r.count}</small></b><span>ترتيبك في الدفعة</span></div><div class="chip"><b>${r.avg ?? "—"}</b><span>متوسط الدفعة</span></div></div>
    <div style="padding:0 24px 20px"><h3 style="color:var(--brand);margin:6px 0">مستواك في كل درس (الاختياري)</h3>
    ${Object.keys(lessons).sort().map((k) => { const L = lessons[k], p = Math.round((L.c / L.t) * 100); return `<div class="lb"><span>${LESSONS[k] || "درس " + k}</span><div class="t"><i style="width:${p}%;background:${p >= 70 ? "var(--ok)" : p >= 50 ? "var(--gold)" : "var(--bad)"}"></i></div><b>${L.c}/${L.t}</b></div>`; }).join("")}
    ${r.notes ? `<div class="nbox"><b>📝 ملاحظات المدرس:</b><br>${esc(r.notes)}</div>` : ""}</div></div>
  <div class="rtabs"><button data-t="mcq">❌ الاختياري (${bad.length + none.length} أخطاء)</button><button data-t="essay">✍️ المقالي (${essay.length})</button></div><div id="rlist"></div></div>`;
  document.querySelectorAll(".rtabs button").forEach((b) => (b.onclick = () => { tab = b.dataset.t; draw(); }));
  draw(); window.scrollTo(0, 0);
}

const backHome = () => boot();

let botEsc = [];
async function botEscalate(i) { const e = botEsc[i]; $("#bot").classList.remove("open"); const { data: { session } } = await sb.auth.getSession(); if (session) supportView(null, e); else window.open(WA, "_blank"); }
function initBot() {
  if ($("#botfab")) return;
  const fab = document.createElement("button"); fab.id = "botfab"; fab.className = "botfab"; fab.textContent = "🤖 مساعد ذكي";
  const box = document.createElement("div"); box.id = "bot"; box.className = "bot";
  box.innerHTML = `<div class="bh"><span>🤖 المساعد الذكي</span><button id="botx" aria-label="إغلاق">✕</button></div><div class="bm" id="bm"></div><div class="bo" id="bo"></div><div class="note">اختار من القائمة 👆 — مفيش كتابة رسائل هنا</div>`;
  document.body.append(fab, box);
  const say = (cls, html) => { const d = document.createElement("div"); d.className = "b " + cls; d.innerHTML = html; $("#bm").appendChild(d); $("#bm").scrollTop = $("#bm").scrollHeight; return d; };
  const mainMenu = () => { $("#bo").innerHTML = BOTMENU.map((c, i) => `<button data-c="${i}">${c.t}</button>`).join(""); };

  mainMenu();
  $("#bo").onclick = async (ev) => {
    const b = ev.target.closest("button"); if (!b) return;
    if (b.dataset.back) { say("me", "⬅ القائمة الرئيسية"); mainMenu(); return; }
    const ci = Number(b.dataset.c);
    if (b.dataset.i === undefined) { say("me", esc(BOTMENU[ci].t)); say("bt", "اختار سؤالك:"); subMenu(ci); return; }
    const it = BOTMENU[ci].items[Number(b.dataset.i)];
    say("me", esc(it.q)); const d = say("bt", esc(it.a));

      const { data: { session } } = await sb.auth.getSession(); botEsc.push(it.e); const i = botEsc.length - 1;

    subMenu(ci);
  };
  fab.onclick = () => box.classList.toggle("open"); $("#botx").onclick = () => box.classList.remove("open");
}

/* ===== لوحة الشرف 🏆 (بتتحدث تلقائيًا بعد كل تصحيح معتمد) ===== */
let HONOR = null, honorAt = null;
const MEDALS = ["🥇", "🥈", "🥉"];
function honorHTML(d) {
  if (!d || d.enabled === false) return "";
  const rows = d.rows || [], tm = honorAt ? honorAt.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" }) : "";
  const top = rows.filter((r) => r.pos <= 3).slice(0, 3), order = top.length === 3 ? [top[1], top[0], top[2]] : top;
  const cls = (r) => "p" + Math.min(3, r.pos);
  return `<div class="honor"><div class="hh"><h2>🏆 لوحة الشرف</h2><small>بتتحدث تلقائيًا بعد كل تصحيح${tm ? " • آخر تحديث " + tm : ""}</small></div>
  ${rows.length ? `<div class="podium">${order.map((r) => `<div class="pc ${cls(r)}"><div class="md">${MEDALS[r.pos - 1] || "🏅"}</div><b>${esc(r.name)}</b><span>${Number(r.total)}${d.max ? " / " + d.max : ""}</span></div>`).join("")}</div>
  ${rows.map((r) => `<div class="hl${r.me ? " me" : ""}"><div class="rk">${r.pos}</div><div>${esc(r.name)}${r.me ? " (أنت 👋)" : ""}${r.center ? `<small>${esc(r.center)}</small>` : ""}</div><div class="sc">${Number(r.total)}${d.max ? `<small>من ${d.max}</small>` : ""}</div></div>`).join("")}
  ${d.me && !rows.some((r) => r.me) ? `<div class="me-line">ترتيبك: ${d.me.pos} من ${d.count} — درجتك ${Number(d.me.total)}</div>` : ""}` : `<div class="em">🕐 لسه مفيش درجات معتمدة. هتظهر الأسماء هنا أول ما المدرس يعتمد أول النتائج.</div>`}</div>`;
}
async function fetchHonor() { try { const { data, error } = await sb.rpc("get_honor_board"); if (!error && data) { HONOR = data; honorAt = new Date(); } } catch (e) {} return HONOR; }
async function renderHonor() {
  const w = document.querySelector("#app .wrap"); if (!w) return;
  let box = $("#honorbox"); if (!box) { box = document.createElement("div"); box.id = "honorbox"; w.appendChild(box); }
  if (HONOR) box.innerHTML = honorHTML(HONOR);
  await fetchHonor(); const b2 = $("#honorbox"); if (b2) b2.innerHTML = honorHTML(HONOR);
}
setInterval(() => { if ($("#honorbox")) renderHonor(); }, 60000);
async function honorView() {
  clearInterval(timerId);
  const { data: { user } } = await sb.auth.getUser();
  const { data: profile } = await sb.from("profiles").select("full_name").eq("id", user.id).single();
  app.innerHTML = topbar(profile, 0) + `<div class="wrap"><button class="btn alt sm" onclick="backHome()">← رجوع</button><div id="hv" style="margin-top:14px"><div class="card2" style="text-align:center">⏳ جارٍ التحميل...</div></div></div>`;
  await fetchHonor(); const h = honorHTML(HONOR); $("#hv").innerHTML = h || `<div class="card2" style="text-align:center">لوحة الشرف غير متاحة حاليًا.</div>`;
}

boot();
